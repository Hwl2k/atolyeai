<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AtölyeAI Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginScreen" class="center">
  <div class="card">
    <h1>⚡ AtölyeAI Pro</h1>
    <input id="username" placeholder="Kullanıcı adı">
    <input id="code" placeholder="Kod (ATLY-0001)">
    <button onclick="login()">🚀 Giriş</button>
    <p>Admin: ADMIN-0001</p>
  </div>
</div>

<div id="app" class="hidden">
  <div class="sidebar">
    <h2>⚡ AtölyeAI</h2>

    <button onclick="show('dashboard')">🏠</button>
    <button onclick="show('stock')">📦</button>
    <button onclick="show('projects')">🛠️</button>
    <button onclick="show('orders')">🛒</button>
    <button onclick="show('messages')">💬</button>

    <button onclick="toggleTheme()">🌙</button>
    <button onclick="logout()">🚪</button>
  </div>

  <div class="main">

    <div id="dashboard">
      <h1>Dashboard</h1>

      <div class="cards">
        <div class="card">📦 <span id="total"></span></div>
        <div class="card">⚠️ <span id="low"></span></div>
        <div class="card">🛠️ <span id="proj"></span></div>
        <div class="card">🛒 <span id="ord"></span></div>
      </div>

      <div class="grid">
        <div class="panel">
          <h3>🔔 Bildirim</h3>
          <div id="notif"></div>
        </div>

        <div class="panel">
          <h3>👥 Kullanıcılar</h3>
          <div id="usersList"></div>
        </div>
      </div>
    </div>

    <div id="stock" class="hidden">
      <h1>📦 Stok</h1>
      <input id="pname" placeholder="Ürün">
      <input id="pcount" type="number" placeholder="Adet">
      <input id="pphoto" placeholder="Foto link">
      <button onclick="addPart()">Ekle</button>
      <div id="plist"></div>
    </div>

    <div id="projects" class="hidden">
      <h1>🛠️ Proje</h1>
      <input id="prname" placeholder="Proje">
      <input id="prparts" placeholder="Parçalar (virgülle)">
      <button onclick="addProject()">Ekle</button>
      <div id="prlist"></div>
    </div>

    <div id="orders" class="hidden">
      <h1>🛒 Sipariş</h1>
      <input id="oname" placeholder="Ürün">
      <input id="oprice" type="number" placeholder="Fiyat">
      <button onclick="addOrder()">Ekle</button>
      <div id="olist"></div>
    </div>

    <div id="messages" class="hidden">
      <h1>💬 Mesaj</h1>
      <input id="msg" placeholder="Mesaj">
      <button onclick="send()">Gönder</button>
      <div id="mlist"></div>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
